<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1ea" />
    <meta name="description" content="家庭账本：记录家庭收支、管理资金账户，与家人共享一本清晰的账。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M18 32l14-12 14 12v15a3 3 0 0 1-3 3H21a3 3 0 0 1-3-3z' fill='none' stroke='%23fffdf8' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M27 50V37h10v13' fill='none' stroke='%23fffdf8' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>家庭账本</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f1ea;
        color: #2c2a26;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #app {
        min-height: 100vh;
      }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        letter-spacing: 0.08em;
        color: #6f675c;
        font-size: 14px;
      }
      .boot-splash__mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #fffdf8;
        background: #0f766e;
        font-family: "Noto Serif SC", "Songti SC", STSong, serif;
        font-size: 22px;
        font-weight: 600;
      }
      .boot-splash__line {
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6ddcf;
      }
      .boot-splash__line::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #0f766e;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__line::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash__mark" aria-hidden="true">家</div>
        <div class="boot-splash__line" aria-hidden="true"></div>
        <span>正在打开家庭账本</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
